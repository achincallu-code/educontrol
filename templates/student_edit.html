{% extends "base.html" %}
{% block title %}Editar alumno · EduControl{% endblock %}
{% block content %}
<div class="heading">
  <div><small class="kicker">ADMINISTRACIÓN</small><h1>Editar datos del alumno</h1><p>Los cambios se guardarán en el registro escolar.</p></div>
  <a class="secondary" href="{{ url_for('students') }}">← Volver al directorio</a>
</div>
<section class="panel edit-form-panel">
  <form method="post" class="activity-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="two">
      <div><label for="edit-first-name">Nombre(s)</label><input id="edit-first-name" name="first_name" maxlength="80" required value="{{ student.first_name or student.full_name }}"></div>
      <div><label for="edit-last-name">Apellidos</label><input id="edit-last-name" name="last_name" maxlength="100" required value="{{ student.last_name or '' }}"></div>
    </div>
    <label for="edit-email">Correo electrónico</label><input id="edit-email" type="email" name="email" maxlength="254" required value="{{ student.email or '' }}">
    <div class="three">
      <div><label for="edit-group">Grupo</label><input id="edit-group" name="group_name" list="student-groups" maxlength="20" required value="{{ student.group_name }}"></div>
      <datalist id="student-groups">{% for group in groups %}<option value="{{ group.group_name }}">{% endfor %}</datalist>
      <div><label for="edit-list-number">Número de lista</label><input id="edit-list-number" name="list_number" type="number" min="1" max="9999" required value="{{ student.list_number }}"></div>
      <div><label for="edit-semester">Semestre</label><select id="edit-semester" name="semester" required><option value="">Selecciona</option>{% for semester in range(1,7) %}<option value="{{ semester }}" {% if student.semester == semester %}selected{% endif %}>{{ semester }}° semestre</option>{% endfor %}</select></div>
    </div>
    <button class="primary">Guardar cambios →</button>
  </form>
</section>
{% endblock %}
